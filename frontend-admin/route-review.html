<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 线路审核</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
    <style>
        .review-card{background:#fff;border-radius:8px;border:1px solid #e8e8e8;padding:20px;margin-bottom:14px;transition:box-shadow .2s}
        .review-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
        .review-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
        .review-name{font-weight:600;font-size:15px}
        .review-meta{font-size:12px;color:#888;margin-bottom:10px;display:flex;gap:12px;flex-wrap:wrap}
        .review-desc{font-size:13px;color:#555;line-height:1.7;background:#fafafa;border-radius:6px;padding:10px 14px;margin-bottom:12px}
        .review-actions{display:flex;gap:8px;justify-content:flex-end}
        .status-badge{padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600}
        .st-SUBMITTED{background:#fff7e6;color:#d48806}
        .st-APPROVED{background:#f6ffed;color:#52c41a}
        .st-REJECTED{background:#fff1f0;color:#ff4d4f}
        .filter-bar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
        .filter-bar select{padding:7px 12px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px}
        .badge-count{background:#ff4d4f;color:#fff;border-radius:10px;padding:1px 8px;font-size:11px;margin-left:6px}
        .spot-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
        .spot-tag{background:#fff0f0;color:#c41a1a;padding:2px 8px;border-radius:6px;font-size:11px}
    </style>
</head>
<body>
<div class="admin-layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><i class="fas fa-flag"></i> 管理后台</div>
        <nav class="sidebar-nav">
            <a href="index.html"><i class="fas fa-tachometer-alt"></i> 仪表盘</a>
            <a href="users.html"><i class="fas fa-users"></i> 用户管理</a>
            <a href="spots.html"><i class="fas fa-map-marker-alt"></i> 景点管理</a>
            <a href="routes.html"><i class="fas fa-route"></i> 线路管理</a>
            <a href="culture.html"><i class="fas fa-book"></i> 文化管理</a>
            <a href="hotels.html"><i class="fas fa-hotel"></i> 酒店管理</a>
            <a href="foods.html"><i class="fas fa-utensils"></i> 美食管理</a>
            <a href="comments.html"><i class="fas fa-comments"></i> 留言管理</a>
            <a href="orders.html"><i class="fas fa-shopping-cart"></i> 订单管理</a>
            <a href="faqs.html"><i class="fas fa-question-circle"></i> FAQ管理</a>
            <div style="border-top:1px solid rgba(255,255,255,.12);margin:8px 12px"></div>
            <a href="feedbacks.html"><i class="fas fa-bullhorn"></i> 问题反馈</a>
            <a href="route-review.html" class="active"><i class="fas fa-clipboard-check"></i> 线路审核</a>
            <a href="spot-review.html"><i class="fas fa-search-plus"></i> 景点审核</a>
            <a href="permissions.html"><i class="fas fa-shield-alt"></i> 权限配置</a>
            <a href="customer-service.html"><i class="fas fa-headset"></i> 人工客服</a>
        </nav>
    </aside>
    <div class="main-content">
        <header class="top-bar">
            <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <h1>用户线路审核</h1>
            <div class="top-bar-right"><span id="adminName"></span> <a href="#" onclick="doLogout()">退出</a></div>
        </header>
        <div class="content">
            <div class="card">
                <div class="card-header">
                    <h2>用户自定义线路审核 <span id="pendingBadge" class="badge-count" style="display:none"></span></h2>
                    <span style="font-size:12px;color:#888">审核通过后将纳入官方推荐线路</span>
                </div>
                <div class="filter-bar">
                    <select id="statusFilter" onchange="load()">
                        <option value="SUBMITTED" selected>待审核</option>
                        <option value="APPROVED">已通过</option>
                        <option value="REJECTED">已驳回</option>
                        <option value="">全部</option>
                    </select>
                    <button class="btn btn-primary btn-sm" onclick="load()"><i class="fas fa-sync"></i> 刷新</button>
                </div>
                <div id="listWrap"><div class="loading"><i class="fas fa-spinner fa-spin"></i></div></div>
                <div class="pagination" id="pagination"></div>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="rejectModal" style="display:none">
    <div class="modal" style="max-width:440px;padding:28px">
        <div style="font-size:16px;font-weight:600;margin-bottom:16px">驳回线路</div>
        <input type="hidden" id="rejectId">
        <div class="form-group">
            <label>驳回原因（必填）</label>
            <textarea id="rejectReason" style="width:100%;padding:10px;border:1px solid #d9d9d9;border-radius:6px;height:90px;resize:vertical;font-size:13px" placeholder="请输入驳回原因…"></textarea>
        </div>
        <div style="display:flex;gap:10px;margin-top:16px;justify-content:flex-end">
            <button class="btn btn-default" onclick="closeReject()">取消</button>
            <button class="btn btn-danger" onclick="doReject()">驳回</button>
        </div>
    </div>
</div>

<script src="js/admin-common.js"></script>
<script>
if (!requireAdmin()) throw '';
renderSidebar();
let currentPage = 1;

async function load() {
    const status = document.getElementById('statusFilter').value;
    const data = await api(`/api/admin/customRoute/list?page=${currentPage}&size=15&status=${encodeURIComponent(status)}`);
    if (!data) return;
    const cnt = await api('/api/admin/customRoute/pendingCount');
    const badge = document.getElementById('pendingBadge');
    if (cnt > 0) { badge.textContent = cnt; badge.style.display = 'inline'; } else badge.style.display = 'none';
    const wrap = document.getElementById('listWrap');
    if (!data.records || data.records.length === 0) {
        wrap.innerHTML = '<div class="empty-state"><p>暂无记录</p></div>'; return;
    }
    wrap.innerHTML = data.records.map(r => {
        let spots = [];
        try { spots = JSON.parse(r.spotData || '[]'); } catch(e) {}
        return `<div class="review-card">
            <div class="review-header">
                <div class="review-name">${escHtml(r.name)}</div>
                <span class="status-badge st-${r.status||'SUBMITTED'}">${statusLabel(r.status)}</span>
            </div>
            <div class="review-meta">
                <span><i class="fas fa-user"></i> ${escHtml(r.username||'--')}</span>
                <span><i class="fas fa-calendar-day"></i> ${r.days||1}天</span>
                <span><i class="fas fa-clock"></i> ${formatDate(r.createTime)}</span>
            </div>
            ${r.description ? `<div class="review-desc">${escHtml(r.description)}</div>` : ''}
            <div style="font-size:12px;color:#888;margin-bottom:8px">包含景点：</div>
            <div class="spot-tags">${spots.map(s => `<span class="spot-tag">${escHtml(s.spotName||s.name||'景点')}</span>`).join('')||'<span style="color:#ccc;font-size:12px">无</span>'}</div>
            ${r.rejectReason ? `<div style="margin-top:8px;font-size:12px;color:#ff4d4f"><i class="fas fa-comment-dots"></i> 驳回原因：${escHtml(r.rejectReason)}</div>` : ''}
            ${r.status === 'SUBMITTED' ? `
            <div class="review-actions" style="margin-top:12px">
                <button class="btn btn-danger btn-sm" onclick="openReject(${r.id})"><i class="fas fa-times"></i> 驳回</button>
                <button class="btn btn-success btn-sm" onclick="doApprove(${r.id})"><i class="fas fa-check"></i> 通过（纳入推荐）</button>
            </div>` : ''}
        </div>`;
    }).join('');
}

function statusLabel(s) { return {SUBMITTED:'待审核',APPROVED:'已通过',REJECTED:'已驳回',DRAFT:'草稿'}[s]||s||'待审核'; }

async function doApprove(id) {
    showConfirm('确定将该线路纳入官方推荐？', async () => {
        const res = await api(`/api/admin/customRoute/approve?id=${id}`);
        if (res) { showToast('已通过，已通知用户'); }
        load();
    });
}
function openReject(id) { document.getElementById('rejectId').value=id; document.getElementById('rejectReason').value=''; document.getElementById('rejectModal').style.display='flex'; }
function closeReject() { document.getElementById('rejectModal').style.display='none'; }
async function doReject() {
    const id = document.getElementById('rejectId').value;
    const reason = document.getElementById('rejectReason').value.trim();
    if (!reason) { showToast('请输入驳回原因','error'); return; }
    const res = await api(`/api/admin/customRoute/reject?id=${id}&reason=${encodeURIComponent(reason)}`);
    if (res) { closeReject(); showToast('已驳回，已通知用户'); }
    load();
}
load();
</script>
</body>
</html>
